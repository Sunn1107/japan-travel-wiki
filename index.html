    // 1. 生成全畫面柔和飄落的雪花
    (function initSnowfall() {
      const container = document.getElementById('snow-layer');
      if (!container) return;
      const flakeCount = 55;
      for (let i = 0; i < flakeCount; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        const size = (Math.random() * 5 + 4).toFixed(1);
        const left = (Math.random() * 100).toFixed(2);
        const duration = (Math.random() * 10 + 9).toFixed(1);
        const delay = (-Math.random() * 20).toFixed(1);
        const opacity = (Math.random() * 0.35 + 0.6).toFixed(2);

        flake.style.width = `${size}px`;
        flake.style.height = `${size}px`;
        flake.style.left = `${left}%`;
        flake.style.opacity = opacity;
        flake.style.animationDuration = `${duration}s`;
        flake.style.animationDelay = `${delay}s`;
        container.appendChild(flake);
      }
    })();

    const EMBEDDED_PAGES = {};
    let catalogData = null;

    async function loadCatalog() {
      if (catalogData) return catalogData;
      try {
        const res = await fetch('wiki/catalog.json');
        if (!res.ok) throw new Error('HTTP error');
        catalogData = await res.json();
      } catch (e) {
        catalogData = EMBEDDED_CATALOG;
      }
      return catalogData;
    }

    async function loadMarkdownText(mdPath) {
      try {
        const res = await fetch(`wiki/${mdPath}`);
        if (!res.ok) throw new Error('HTTP error');
        return await res.text();
      } catch (e) {
        if (EMBEDDED_PAGES[mdPath]) return EMBEDDED_PAGES[mdPath];
        throw e;
      }
    }

    function parseFrontmatter(text) {
      const normalized = text.replace(/\r\n/g, '\n');
      const match = normalized.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!match) return { meta: null, content: normalized };
      const metaLines = match[1].split('\n');
      const meta = {};
      metaLines.forEach(line => {
        const idx = line.indexOf(':');
        if (idx > -1) {
          meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
        }
      });
      return { meta, content: match[2] };
    }

    // 卡片元件（右上角附立體紅色大頭圖釘 .card-pushpin）
    function renderCardHTML({ badge, icon = '', title, enSubtitle = '', summary, tags = [], buttonText = '進入 →', href }) {
      const chipsHTML = tags.map(t => `<span class="tag-chip">${t}</span>`).join('');
      return `
        <article class="journal-card" onclick="location.hash='${href}'">
          <span class="card-pushpin" aria-hidden="true"></span>
          <div class="card-meta-row">
            <span class="pill-badge">${badge}</span>
          </div>
          <h2 class="card-title">
            ${icon ? `<span class="card-icon">${icon}</span>` : ''}
            <span>${title}</span>
            ${enSubtitle ? `<span class="card-en-sub">${enSubtitle}</span>` : ''}
          </h2>
          <div class="card-hairline"></div>
          <p class="card-desc">${summary}</p>
          <div class="card-tags">${chipsHTML}</div>
          <div class="card-footer">
            <a href="${href}" class="action-btn" onclick="event.stopPropagation()">${buttonText}</a>
          </div>
        </article>
      `;
    }

    // 視圖 4：Markdown 實體詳情頁 / 攻略頁 / 常用日文 / 日誌頁
    async function renderMarkdownPageView(mdPath, queryString = '') {
      const params = new URLSearchParams(queryString);
      const fromCity = params.get('fromCity');
      const fromCat = params.get('fromCat');

      let backHref = '#/';
      let backLabel = '← 返回城市首頁';
      if (fromCity && fromCat) {
        backHref = `#/city/${fromCity}/${fromCat}`;
        backLabel = '← 返回分類清單';
      } else if (fromCity) {
        backHref = `#/city/${fromCity}`;
        backLabel = '← 返回城市分類';
      }

      const isPhrasebook = mdPath === 'guides/travel-phrases.md';
      const pageCrumb = isPhrasebook ? '🗣️ 常用日文' : '詳細攻略';

      const bc = document.getElementById('breadcrumb');
      bc.classList.remove('hidden');
      bc.innerHTML = `<a href="#/">🏠 城市首頁</a> <span class="sep">/</span> <a href="${backHref}">${backLabel.replace('← ', '')}</a> <span class="sep">/</span> <strong>${pageCrumb}</strong>`;

      try {
        const rawText = await loadMarkdownText(mdPath);
        const { meta, content } = parseFrontmatter(rawText);

        const metaHTML = meta ? `
          <div class="detail-meta">
            <span class="pill-badge">${meta.category || 'wiki'}</span>
            ${meta.city ? `<span class="tag-chip">${meta.city.toUpperCase()}</span>` : ''}
            ${meta.tags ? `<span class="tag-chip">${meta.tags}</span>` : ''}
            ${meta.last_updated ? `<span class="tag-chip">更新於 ${meta.last_updated}</span>` : ''}
          </div>
        ` : '';

        // 若是常用日文手冊，提供快速情境跳轉列，方便旅途中單手切換
        const quickNavHTML = isPhrasebook ? `
          <div class="phrase-filter-bar" aria-label="日文情境快速索引">
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(0)">1. 招呼問候</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(1)">2. 迷路問路</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(2)">3. 飯店住宿</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(3)">4. 餐廳點餐</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(4)">5. 車站電車</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(5)">6. 觀光拍照</button>
            <button type="button" class="phrase-jump-btn" onclick="scrollToHeading(6)">7. 商店購物</button>
          </div>
        ` : '';

        document.getElementById('app-root').innerHTML = `
          <div class="detail-sheet">
            <span class="card-pushpin" aria-hidden="true"></span>
            <div class="detail-topbar">
              ${metaHTML}
              <a href="${backHref}" class="back-btn">${backLabel}</a>
            </div>
            ${quickNavHTML}
            <article id="md-body" class="markdown-body">${marked.parse(content)}</article>
          </div>
        `;

        const mdBody = document.getElementById('md-body');
        if (window.renderMathInElement) {
          renderMathInElement(mdBody, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }

        mdBody.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href');
          if (!href) return;
          if (href.startsWith('http://') || href.startsWith('https://')) {
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener noreferrer');
          } else if (href.endsWith('.md')) {
            a.addEventListener('click', (e) => {
              e.preventDefault();
              const baseParts = mdPath.split('/');
              baseParts.pop();
              href.split('/').forEach(p => {
                if (p === '..') baseParts.pop();
                else if (p !== '.' && p !== '') baseParts.push(p);
              });
              const resolved = baseParts.join('/');
              if (resolved.startsWith('cities/')) {
                const cid = resolved.replace('cities/', '').replace('.md', '');
                location.hash = `#/city/${cid}`;
              } else {
                location.hash = `#/page/${resolved}`;
              }
            });
          }
        });
      } catch (err) {
        document.getElementById('app-root').innerHTML = `
          <div class="detail-sheet">
            <span class="card-pushpin" aria-hidden="true"></span>
            <p>無法載入 <code>wiki/${mdPath}</code>，請確認檔案路徑是否正確。</p>
            <a href="#/" class="back-btn">← 返回首頁</a>
          </div>
        `;
      }
    }

    function scrollToHeading(index) {
      const headings = document.querySelectorAll('#md-body h2');
      if (headings[index]) {
        headings[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    async function router() {
      const rawHash = location.hash.replace(/^#/, '') || '/';
      const [pathPart, queryPart] = rawHash.split('?');
      const segments = pathPart.split('/').filter(Boolean);

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (segments.length === 0) {
        await renderHomeView();
      } else if (segments[0] === 'city' && segments.length === 2) {
        await renderCityView(segments[1]);
      } else if (segments[0] === 'city' && segments.length === 3) {
        await renderCategoryListView(segments[1], segments[2]);
      } else if (segments[0] === 'page' && segments.length >= 2) {
        const mdPath = segments.slice(1).join('/');
        await renderMarkdownPageView(mdPath, queryPart || '');
      } else {
        await renderHomeView();
      }
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
